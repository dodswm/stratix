name: Build unsigned Starfold IPAs (iOS + tvOS)

# Builds github.com/JarvanSun/Starfold (needs Xcode 27) from this fork's `ipa` branch.
on:
  push:
    branches: [ipa]
    paths: ['.github/workflows/build-starfold.yml']

permissions:
  contents: write

jobs:
  starfold:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          repository: JarvanSun/Starfold
          path: starfold

      - name: List installed Xcodes
        run: ls -d /Applications/Xcode* || true

      - name: Select newest Xcode (incl. beta)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Build and package
        working-directory: starfold
        run: |
          set -eo pipefail
          echo "::notice::$(xcodebuild -version | tr '\n' ' ') | installed: $(ls -d /Applications/Xcode* | tr '\n' ' ')"
          mkdir -p ../out
          for pair in StarfoldiOS:iOS:iphoneos StarfoldTV:tvOS:appletvos; do
            IFS=: read scheme platform sdk <<<"$pair"
            xcodebuild -project Starfold.xcodeproj -scheme "$scheme" -configuration Release \
              -destination "generic/platform=$platform" -derivedDataPath "/tmp/dd-$scheme" \
              -skipPackagePluginValidation -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              build > "/tmp/$scheme.log" 2>&1 || {
                grep -E "error:|fatal" "/tmp/$scheme.log" | sort -u | head -15 | while IFS= read -r l; do echo "::error::$scheme: ${l: -400}"; done
                tail -5 "/tmp/$scheme.log" | while IFS= read -r l; do echo "::error::$scheme tail: $l"; done
                exit 1; }
            app=$(find "/tmp/dd-$scheme/Build/Products/Release-$sdk" -maxdepth 1 -name '*.app' | head -1)
            echo "$scheme -> $app"
            rm -rf /tmp/pkg && mkdir -p /tmp/pkg/Payload && cp -R "$app" /tmp/pkg/Payload/
            (cd /tmp/pkg && zip -qry "$GITHUB_WORKSPACE/out/$scheme.ipa" Payload)
          done
          ls -la ../out
          echo "SF_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="starfold-$SF_SHA-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" out/*.ipa -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Starfold unsigned IPAs ($tag)" \
            --notes "Unsigned iOS and tvOS builds of JarvanSun/Starfold@$SF_SHA for sideloading."
